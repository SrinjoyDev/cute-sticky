[package]
name = "cute-sticky"
version = "0.1.0"
description = "A tiny always-on-top sticky notes dock for Windows"
authors = ["Srinjoy Das"]
license = "MIT"
repository = "https://github.com/SrinjoyDev/cute-sticky"
edition = "2021"
rust-version = "1.80"

[lib]
name = "cute_sticky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
rand = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
